[project]
name = "sim-dags"
version = "1.4.1"
description = "A library for simulating from DAGs and automating do-calculus operations"
readme = "README.md"
requires-python = ">=3.14"
authors = [
  { name = "Luc Heuff", email = "10941592+LucHeuff@users.noreply.github.com" }
]
dependencies = [
  "altair[all]>=6.1.0",
  "more-itertools>=11.0.2",
  "pandera[polars]>=0.29.0",
  "polars>=1.38.1",
  "pyarrow>=23.0.1",
  "scipy>=1.17.1",
  "tqdm>=4.70.0",
  "xarray>=2026.2.0",
]

[dependency-groups]
dev = [
  "hypothesis>=6.151.9",
  "networkx>=3.6.1",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.coverage.run]
omit = [
  "*/.local/*",
]
